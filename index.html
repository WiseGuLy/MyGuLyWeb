<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuLi的网站</title>
    <style>
        /* 重置边距，白色背景，内容居中 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            color: #222;
            margin-bottom: 1.5rem;
            font-weight: 400;
        }
        button {
            padding: 12px 36px;
            font-size: 1.2rem;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            background-color: #f5f5f5;
            color: #333;
            cursor: default;      /* 鼠标悬停不变成手型，暗示无交互 */
            user-select: none;    /* 避免选中文本 */
            transition: none;     /* 无动画 */
        }
        /* 按钮无 hover 效果，保持完全静止 */
    </style>
</head>
<body>
    <div class="container">
        <h1>GuLi的网站</h1>
        <button type="button">按钮</button>
        <!-- type="button" 确保不会触发表单提交，按下无任何反应 -->
    </div>
</body>
</html>
