<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuLi 导航收藏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            color: #222;
        }
        .container {
            max-width: 860px;
            width: 100%;
        }
        h1 {
            text-align: center;
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 45px;
            color: #1a1a1a;
        }
        .section {
            margin-bottom: 35px;
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #222;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 8px;
            margin-bottom: 16px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            padding: 8px 0;
            border-bottom: 1px dashed #f0f0f0;
        }
        li:last-child {
            border-bottom: none;
        }
        .site-name {
            font-size: 1.1rem;
            font-weight: 500;
            color: #111;
            min-width: 100px;
            margin-right: 12px;
        }
        a {
            color: #0366d6;
            text-decoration: none;
            font-size: 0.95rem;
            word-break: break-all;
            transition: opacity 0.1s;
        }
        a:hover {
            text-decoration: underline;
            opacity: 0.8;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            .site-name {
                min-width: 70px;
                font-size: 1rem;
            }
            li {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                padding: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GuLi 网站导航/收藏</h1>

        <div class="section">
            <div class="section-title">社区网站：</div>
            <ul>
                <li>
                    <span class="site-name">B站</span>
                    <a href="https://www.bilibili.com" target="_blank" rel="noopener noreferrer">https://www.bilibili.com</a>
                </li>
                <li>
                    <span class="site-name">油管</span>
                    <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">https://www.youtube.com</a>
                </li>
            </ul>
        </div>

        <div class="section">
            <div class="section-title">实用工具：</div>
            <ul>
                <li>
                    <span class="site-name">在线生成ICO图标</span>
                    <a href="https://www.51tool.com/ico/" target="_blank" rel="noopener noreferrer">https://www.51tool.com/ico/</a>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
